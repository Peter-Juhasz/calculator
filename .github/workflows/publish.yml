name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native AOT links with the MSVC toolchain of the host, so each RID builds on its own architecture.
          - rid: win-x64
            platform: x64
            runner: windows-latest
          - rid: win-arm64
            platform: ARM64
            runner: windows-11-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --solution Calculator.slnx -c Release -p:Platform=${{ matrix.platform }}

      - name: Publish
        run: >-
          dotnet publish src/Calculator.Client.WinUI3/Calculator.Client.WinUI3.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          -o artifacts/${{ matrix.rid }}

      - uses: actions/upload-artifact@v5
        with:
          name: calculator-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Zip
        working-directory: artifacts
        run: for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/*.zip --repo "${{ github.repository }}" --generate-notes
